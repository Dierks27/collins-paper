plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = "org.sawiq"
version = "1.8.0"

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    // Protection plugins, compile-time only (soft dependencies at runtime).
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://repo.glaremasters.me/repository/towny/' }
}

dependencies {
    // Paper 26.3 API, pinned to a verified-good build for reproducibility.
    // Bump it deliberately when a newer build is wanted.
    compileOnly "io.papermc.paper:paper-api:26.3.build.230-stable"

    // Only their API is called (see protect/BuildProtection), so none of
    // their own dependencies are pulled in.
    compileOnly("com.sk89q.worldguard:worldguard-bukkit:7.0.21") { transitive = false }
    compileOnly("com.palmergames.bukkit.towny:towny:0.103.2.15") { transitive = false }

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

tasks {
    runServer {
        minecraftVersion("26.3")
    }
}

java {
    // Paper 26.x runs on Java 25; the toolchain is pinned so the bytecode
    // matches the live server. Gradle provisions JDK 25 through the foojay
    // resolver (see settings.gradle) when it is not installed.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// Suffix the plugin jar with the targeted MC version so a release can pair
// collins-fabric-<v>-mc26.3.jar with collins-paper-<v>-mc26.3.jar without
// ambiguity.
tasks.named("jar") {
    // Ship the GPL-3.0 text inside the jar, as the Fabric half does.
    from("LICENSE")
    archiveFileName = "${project.name}-${project.version}-mc26.3.jar"
}
