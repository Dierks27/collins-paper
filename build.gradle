plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = "org.sawiq"
version = "1.5"

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Paper 26.3 API, pinned to a verified-good build for reproducibility.
    // Bump it deliberately when a newer build is wanted.
    compileOnly "io.papermc.paper:paper-api:26.3.build.230-stable"
}

tasks {
    runServer {
        minecraftVersion("26.3")
    }
}

java {
    // Paper 26.x runs on Java 25; the toolchain is pinned so the bytecode
    // matches the live server. Gradle provisions JDK 25 through the foojay
    // resolver (see settings.gradle) when it is not installed.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// Suffix the plugin jar with the targeted MC version so a release can pair
// collins-fabric-<v>-mc26.3.jar with collins-paper-<v>-mc26.3.jar without
// ambiguity.
tasks.named("jar") {
    // Ship the GPL-3.0 text inside the jar, as the Fabric half does.
    from("LICENSE")
    archiveFileName = "${project.name}-${project.version}-mc26.3.jar"
}
