name: collins-paper
version: 1.8.0
main: org.sawiq.collins.paper.CollinsPaperPlugin
api-version: "1.21"
folia-supported: true
authors: [sawiq_, Zorsh, EssciZ]
website: https://github.com/Dierks27/collins-paper
# Asked, when installed, whether a player may build where they put a screen.
softdepend: [Towny, WorldGuard]

commands:
  collins:
    description: Collins screens manager
    usage: /collins <pos1|pos2|create|seturl|play|stop|pause|resume|loop|quality|seek|back|volume|radius|remove|list|playlist|owner|remote>
    aliases: [col]

permissions:
  collins.use:
    description: Make screens, and control, change and remove your own
    # Every player. A permissions plugin can take it away from a player or
    # group (e.g. LuckPerms: permission set collins.use false).
    default: true
  collins.admin:
    description: Manage anyone's screens, the server-wide volume and hear radius, and screen owners
    # Ops only. For an admin group, e.g. LuckPerms:
    # lp group admin permission set collins.admin true
    default: op
    children:
      collins.use: true
  collins.url.any:
    description: Put any address on a screen, not only the hosts in security.allowedHosts
    # Ops only. For an admin group, e.g. LuckPerms:
    # lp group admin permission set collins.url.any true
    default: op
  collins.remote.craft:
    description: Craft the TV Remote (using it needs collins.use)
    # Every player, like collins.admin. To take it away from a player or
    # group, e.g. LuckPerms: permission set collins.remote.craft false
    default: true
