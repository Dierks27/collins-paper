name: collins-paper
version: 1.5.1
main: org.sawiq.collins.paper.CollinsPaperPlugin
api-version: "1.21"
folia-supported: true
authors: [sawiq_, Zorsh, EssciZ]
website: https://github.com/Dierks27/collins-paper

commands:
  collins:
    description: Collins screens manager
    usage: /collins <pos1|pos2|create|seturl|play|stop|pause|resume|loop|quality|seek|back|volume|radius|remove|list|playlist>
    aliases: [col]

permissions:
  collins.admin:
    description: Create, control and remove Collins screens
    # Every player, not only ops. A permissions plugin can still take it away
    # from a player or group (e.g. LuckPerms: permission set collins.admin false).
    default: true
